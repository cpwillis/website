    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        text-align: center;
        color: white;
        background: linear-gradient(to right, #ff8a00, #da1b60, #ff0084);
